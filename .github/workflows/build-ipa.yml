name: Build Unsigned IPA (iOS 27)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Cloner le code
        uses: actions/checkout@v4

      - name: Vérifier Xcode
        run: xcodebuild -version

      - name: Compiler l'application sans signature
        run: |
          xcodebuild archive \
              -project Yattee.xcodeproj \
              -scheme Yattee \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath $RUNNER_TEMP/Yattee.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

      - name: Empaqueter en .ipa
        run: |
          mkdir -p Payload
          cp -r $RUNNER_TEMP/Yattee.xcarchive/Products/Applications/*.app Payload/
          zip -r Yattee-LiquidGlass.ipa Payload

      - name: Publier le fichier .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yattee-iOS27-IPA
          path: Yattee-LiquidGlass.ipa
